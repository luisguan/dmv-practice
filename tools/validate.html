<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Question bank validation</title>
<style>
  body { font: 15px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; margin: 24px; }
  h1 { font-size: 18px; }
  .ok   { color: #12692f; font-weight: 700; }
  .bad  { color: #a31414; font-weight: 700; }
  .warn { color: #8a6100; }
  li { margin: 2px 0; }
</style>
</head>
<body>
<h1>Question bank validation</h1>
<div id="out">running…</div>

<script src="../data/bank.js"></script>
<script src="../data/official.js"></script>
<script src="../data/handbook-1.js"></script>
<script src="../data/handbook-2.js"></script>
<script src="../data/handbook-3.js"></script>
<script src="../data/handbook-4.js"></script>
<script src="../data/en-official.js"></script>
<script src="../data/en-handbook-1.js"></script>
<script src="../data/en-handbook-2.js"></script>
<script src="../data/signs.js"></script>
<script src="../data/provided-1.js"></script>
<script src="../data/provided-2.js"></script>
<script src="../data/provided-3.js"></script>
<script src="../data/provided-4.js"></script>
<script src="../data/provided-5.js"></script>
<script src="../data/provided-signs.js"></script>
<script src="validate-bank.js"></script>
<script>
  var r = window.validateBank();
  var html = '<p>total <b>' + r.total + '</b> &middot; shuffled pool <b>' + r.pool +
             '</b> &middot; official <b>' + r.official + '</b> &middot; provided <b>' + r.provided +
             '</b> &middot; handbook <b>' + r.handbook + '</b> &middot; with signs <b>' + r.signs + '</b></p>';

  html += r.errors.length
    ? '<p class="bad">' + r.errors.length + ' ERROR(S)</p><ul><li>' + r.errors.join('</li><li>') + '</li></ul>'
    : '<p class="ok">no errors</p>';

  if (r.warnings.length) {
    html += '<p class="warn">' + r.warnings.length + ' warning(s)</p><ul class="warn"><li>' +
            r.warnings.join('</li><li>') + '</li></ul>';
  }

  document.getElementById('out').innerHTML = html;
  window.__report = r;
</script>
</body>
</html>
